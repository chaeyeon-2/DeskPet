name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & test
    # Package.swift declares swift-tools-version 6.0, so the runner needs Swift 6.
    # (the macos-14 runner ships Swift 5.10 and cannot build this package)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -v

      - name: Unit tests
        run: swift run DeskPetTests

      - name: Build .app bundle (includes signature verification)
        run: ./Scripts/build_app.sh

      - name: Sprite export smoke test
        run: |
          ./build/DeskPet.app/Contents/MacOS/DeskPet --export-sprites ./sprite-check --scale 4
          ls ./sprite-check

      - name: Upload sprite artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprites
          path: ./sprite-check/_all_states.png
          if-no-files-found: error
