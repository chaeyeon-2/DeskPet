name: Feature request / 아이디어
description: New outfits, animations or speech lines
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind?
      options:
        - New outfit
        - New animation
        - New speech line
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      placeholder: e.g. A hoodie, with the drawstrings swaying a little
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Reference image (optional)
      description: Link rather than upload anything copyrighted, please.
