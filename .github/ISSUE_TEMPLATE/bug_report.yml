name: Bug report / 버그 신고
description: Something misbehaves or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: e.g. The character does not type along when I type
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. ...
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.1 / Apple Silicon"
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: Diagnostics (for typing-detection issues)
      description: |
        Run this, type for 20 seconds, and paste the result.
        ```
        /Applications/DeskPet.app/Contents/MacOS/DeskPet --diagnose /tmp/deskpet.txt
        cat /tmp/deskpet.txt
        ```
      render: text
